workflows:
  android-build:
    name: Slice Smile Android APK
    max_build_duration: 30

    environment:
      java: 17

    scripts:
      - name: Build Android APK
        script: |
          gradle wrapper --gradle-version 9.3.1
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk
